## kode-sdk at release v0.1.5, the one kodeOS builds its apps with,
## and the F*CK SDK from this checkout. An app outside this repository pins
## fck from git instead, at a release:
##
##   kodediy/fck:
##     git: https://github.com/kodediy/kode-fck-sdk.git
##     path: components/fck
##     version: <tag>
##
## and the rest (fck_aos, fck_drv and fck_bsp) arrive at the same commit through its
## own manifest.
dependencies:
  kodediy/kode:
    git: https://github.com/kodediy/kode-sdk.git
    path: components/kode
    version: v0.1.5
  kodediy/fck:
    override_path: "../../../components/fck"
  kodediy/fck_aos:
    override_path: "../../../components/fck_aos"
  kodediy/fck_drv:
    override_path: "../../../components/fck_drv"
  kodediy/fck_bsp:
    override_path: "../../../components/fck_bsp"
