# MCUboot image config for the FCK nRF54L15 - serial recovery over UART (unbrick path).
# Applied to the MCUboot sysbuild image.

# Serial recovery over a hardware UART (contents of mcuboot/boot/zephyr/serial_recovery.conf).
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_UART=y
CONFIG_UART_CONSOLE=n

# No free GPIO for an entrance strap (only the 2 UART wires reach the P4). Enter recovery
# by a short DFU-wait window on every boot, triggered by the P4 bridge's ~~rst. Bumped from
# the 500 ms default so the Mac's port-open + first mcumgr packet land inside the window.
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU_TIMEOUT=3000

# Brick-proof fallback: if slot0 has no valid image, stay in serial recovery indefinitely.
CONFIG_BOOT_VALIDATE_SLOT0=y
CONFIG_BOOT_SERIAL_NO_APPLICATION=y

# Before it starts the image, MCUboot closes its own 31 KB to it: no read, no write, no execution,
# until the next reset (RRAMC region 4). NCS 3.4 turns none of the nRF54L's protections on by itself.
CONFIG_NCS_MCUBOOT_DISABLE_SELF_RWX=y

# The host asks which loader this is with `echo`: this one answers it, and the loaders the first
# modules carry do not. (`slot info` would say more, but with one slot NCS 3.4.2 does not link it:
# single_loader.c and bootutil_misc.c both define boot_get_max_app_size().)
CONFIG_BOOT_MGMT_ECHO=y

# A watchdog the firmware left running is fed while MCUboot waits and while it takes an image.
CONFIG_BOOT_WATCHDOG_FEED=y

# Nothing is printed: no pin carries it, and the code is room MCUboot does not have.
CONFIG_LOG=n

# The image list (and the slot it reads) needs room for every sector of the slot: 0x157000 is 343
# sectors of 4 KB on the nRF54L15's RRAM, and the 256 this build got without it leaves the list answering rc 1 (EUNKNOWN)
# with or without an image. An upload and the boot do not count
# sectors, so they worked; the SDK reads the list. 512 costs RAM only: MCUboot's code is the same size.
CONFIG_BOOT_MAX_IMG_SECTORS=512
