# fck-nrf - nRF54L15 (U701) on the F*CK module, nRF Connect SDK v3.4.2.
# One UART (uart00, P2.02/P2.00 -> ESP32-P4) carries the Zephyr shell (text commands, '#' machine
# lines) and mcumgr SMP over the shell transport (smpmgr image upload / state-write / reset).

# ---- MCUboot image (sysbuild) ------------------------------------------------------------
CONFIG_BOOTLOADER_MCUBOOT=y
# The version imgtool stamps into the image header is not set here: with a VERSION file,
# CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION defaults to its major.minor.patch+tweak. Bump VERSION on
# every release so a DFU proves something.

# ---- Shell on uart00, machine friendly ---------------------------------------------------
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
# No prompt, no echo, no colours, no VT100 cursor games: the host reads plain lines, exactly like
# fck-c5. What is typed is never echoed, and no command turns the echo on.
CONFIG_SHELL_PROMPT_UART=""
CONFIG_SHELL_ECHO_STATUS=n
CONFIG_SHELL_VT100_COLORS=n
CONFIG_SHELL_VT100_COMMANDS=n
CONFIG_SHELL_TAB=n
CONFIG_SHELL_TAB_AUTOCOMPLETION=n
CONFIG_SHELL_HISTORY=n
CONFIG_SHELL_WILDCARD=n
CONFIG_SHELL_METAKEYS=n
CONFIG_SHELL_STATS=n
# Zephyr's shell only reads the line: every line goes to the firmware's one root command, `fck`
# (main.c), which splits it and ends it with #DONE whatever it held. So none of the shell's own
# commands (clear, help, history, resize, retval, select, shell), no help printed for `-h` or for
# a wrong number of arguments, and none of its own messages.
CONFIG_SHELL_CMD_ROOT="fck"
CONFIG_SHELL_CMDS=n
CONFIG_SHELL_HELP=n
CONFIG_SHELL_MSG_CMD_NOT_FOUND=n
CONFIG_SHELL_MSG_SPECIFY_SUBCOMMAND=n
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=256
CONFIG_SHELL_ARGC_MAX=12

# Nothing else may write on the wire: no logging, no boot banners.
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n

# ---- mcumgr SMP over the shell transport (img + os groups) ------------------------------
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_BASE64=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_SHELL=y
# A stray/partial SMP header must not lock the shell forever.
CONFIG_MCUMGR_TRANSPORT_SHELL_INPUT_TIMEOUT=y
CONFIG_MCUMGR_TRANSPORT_SHELL_INPUT_TIMEOUT_TIME=3000
# No image group: with one slot an image is written by MCUboot's recovery, never by the firmware.
# CONFIG_MCUMGR_GRP_IMG is not set
CONFIG_MCUMGR_GRP_OS=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_REBOOT=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=2176

# No external SPI-NOR on the FCK (the DK's mx25r64 is disabled in the overlay).
CONFIG_SPI_NOR=n

# ---- Watchdog: WDT31 (enabled in the overlay), fed and stopped by main.c ------------------
CONFIG_WATCHDOG=y

# ---- Radio: the app owns RADIO directly (no Bluetooth / MPSL / 802.15.4 in this build) -----
CONFIG_CLOCK_CONTROL=y
CONFIG_GPIO=y

# ---- Shell commands that reach memory or the kernel: off -----------------------------------
# Zephyr's default shell modules would let anything on the UART read and write physical memory
# (UICR.BOOTCONF, RRAMC ERASEALL, RADIO) with no image and no SMP.
CONFIG_DEVMEM_SHELL=n
CONFIG_KERNEL_SHELL=n
CONFIG_DEVICE_SHELL=n
CONFIG_DATE_SHELL=n
# The VERSION file would bring Zephyr's `app` command with it.
CONFIG_APP_VERSION_SHELL=n
