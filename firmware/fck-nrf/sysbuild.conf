# MCUboot for production: one application slot, and an image is taken by its hash alone.
#
# One slot: the module's host, the Kode, can always write the nRF again through MCUboot's serial
# recovery, so a second slot buys nothing here, and the loader that swaps two slots reads a size from
# the image's own slot before it listens to the UART. An image is written by recovery and by nothing
# else.
#
# No signature (SHA-256 of the image and no key): anyone builds and writes their own firmware. It is
# also what keeps MCUboot under the 31 KB that the nRF54L15 can protect (pm_static.yml).
#
# The partition map is pm_static.yml: NCS 3.4 does not read it unless the Partition Manager is asked
# for, and without it the image is linked for the DK's own map and does not start on the module.
SB_CONFIG_PARTITION_MANAGER=y
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_SINGLE_APP=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_NONE=y
