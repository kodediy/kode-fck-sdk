## kode-sdk at release v0.1.5, as an app for kodeOS pins it, and this
## tree's own components by path: the target build checks the code in the
## checkout, never a tag.
dependencies:
  kodediy/kode:
    git: https://github.com/kodediy/kode-sdk.git
    path: components/kode
    version: v0.1.5
  kodediy/fck:
    override_path: "../../../components/fck"
  kodediy/fck_sys:
    override_path: "../../../components/fck_sys"
  kodediy/fck_aos:
    override_path: "../../../components/fck_aos"
  kodediy/fck_drv:
    override_path: "../../../components/fck_drv"
  kodediy/fck_bsp:
    override_path: "../../../components/fck_bsp"
